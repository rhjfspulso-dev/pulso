<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Pulso JFS · Dashboard RH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--linha:#30363d;--linha2:#3d444d;
  --txt:#e6edf3;--txt2:#7d8590;--txt3:#484f58;
  --neon:#ff3366;--neon-glow:rgba(255,51,102,.15);
  --verde:#39d353;--verde-bg:rgba(57,211,83,.12);--amarelo:#d29922;--amarelo-bg:rgba(210,153,34,.12);
  --vermelho:#f85149;--vermelho-bg:rgba(248,81,73,.12);
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}

/* login */
.login{max-width:340px;margin:80px auto;text-align:center}
.login .logo{font-size:28px;font-weight:700;margin-bottom:6px}
.login .logo span{color:var(--neon)}
.login p{color:var(--txt2);font-size:13px;margin-bottom:22px}
.login input{width:100%;padding:13px;background:var(--bg2);border:1px solid var(--linha);border-radius:9px;color:var(--txt);font-family:var(--mono);font-size:15px;text-align:center;letter-spacing:4px;margin-bottom:12px}
.login input:focus{outline:none;border-color:var(--neon)}
.login button{width:100%;padding:13px;background:var(--neon);color:#fff;border:none;border-radius:9px;font-weight:600;font-size:14px;cursor:pointer;font-family:var(--sans)}
.login .erro{color:var(--vermelho);font-size:12px;margin-top:10px;min-height:16px}

.painel{display:none}
.painel.on{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid var(--linha);position:relative;flex-wrap:wrap;gap:10px}
.top::before{content:'';position:absolute;top:-28px;left:-20px;right:-20px;height:3px;background:linear-gradient(90deg,transparent,var(--neon),transparent)}
.top .logo{font-size:20px;font-weight:700}
.top .logo span{color:var(--neon)}
.top .sub{font-family:var(--mono);font-size:11px;color:var(--txt2);margin-top:2px}
.top-acoes{display:flex;gap:8px}
.tbtn{padding:8px 14px;background:var(--bg2);border:1px solid var(--linha);border-radius:8px;color:var(--txt2);font-size:12px;font-family:var(--mono);cursor:pointer}
.tbtn:hover{border-color:var(--neon);color:var(--txt)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--bg2);border:1px solid var(--linha);border-radius:12px;padding:16px}
.kpi-lbl{font-size:11px;font-family:var(--mono);color:var(--txt2);text-transform:uppercase;letter-spacing:.5px}
.kpi-num{font-size:32px;font-weight:700;font-family:var(--mono);margin:6px 0 2px}
.kpi-sub{font-size:11px;color:var(--txt3)}
.kpi-num.neon{color:var(--neon)}
.kpi-num.verde{color:var(--verde)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--linha);border-radius:12px;padding:18px;margin-bottom:16px}
.card-tit{font-size:13px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-tit::before{content:'';width:3px;height:14px;background:var(--neon);border-radius:2px}

/* barras de adesão */
.uni-row{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;padding:7px 0;font-size:12px}
.uni-nome{color:var(--txt2)}
.bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .5s}
.uni-pct{font-family:var(--mono);font-weight:600;text-align:right}

/* distribuição de faixas */
.faixa-row{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;padding:7px 0;font-size:12px}

/* heatmap */
.heat-scroll{overflow-x:auto}
.heat{display:grid;gap:3px;font-size:10px;min-width:640px}
.heat-hd{font-family:var(--mono);color:var(--txt2);padding:4px 2px;text-align:center;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);height:70px}
.heat-lbl{color:var(--txt2);padding:6px 8px;display:flex;align-items:center;font-size:11px}
.heat-cell{padding:8px 2px;text-align:center;border-radius:4px;font-family:var(--mono);font-weight:600;font-size:11px}

/* lista quem falta */
.falta-lista{max-height:340px;overflow-y:auto}
.falta-row{display:grid;grid-template-columns:1fr 90px 60px 70px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--linha);font-size:12px}
.falta-row:last-child{border:none}
.falta-nome{font-weight:500}
.falta-meta{font-family:var(--mono);font-size:10px;color:var(--txt2)}
.tag{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:10px;text-align:center}
.tag-email{background:var(--verde-bg);color:var(--verde)}
.tag-wa{background:var(--amarelo-bg);color:var(--amarelo)}
.tag-sem{background:var(--vermelho-bg);color:var(--vermelho)}

.vazio{text-align:center;padding:30px;color:var(--txt3);font-size:13px}
.loading{text-align:center;padding:60px;color:var(--txt2)}
.spin{width:30px;height:30px;border:2px solid var(--linha);border-top-color:var(--neon);border-radius:50%;margin:0 auto 14px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}

@media(max-width:720px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="wrap" id="tela-login">
  <div class="login">
    <div class="logo">Pulso <span>JFS</span></div>
    <p>Dashboard do RH · acesso restrito</p>
    <input type="password" id="pin" placeholder="• • • •" maxlength="10" inputmode="numeric">
    <button onclick="entrar()">Entrar</button>
    <div class="erro" id="login-erro"></div>
  </div>
</div>

<!-- PAINEL -->
<div class="wrap painel" id="painel">
  <div class="top">
    <div>
      <div class="logo">Pulso <span>JFS</span></div>
      <div class="sub" id="top-sub">Dashboard do RH · Ciclo 2026</div>
    </div>
    <div class="top-acoes">
      <button class="tbtn" onclick="carregar()">↻ Actualizar</button>
      <button class="tbtn" onclick="sair()">Sair</button>
    </div>
  </div>

  <div id="conteudo">
    <div class="loading"><div class="spin"></div>A carregar dados…</div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzBreSCJ6tSVYfzKzmOUgWm2UpGdBfoUYQEKlg57k4KQTdZbikGeXB29jt8BHFh09YA/exec';
let PIN = '';

function entrar() {
  PIN = document.getElementById('pin').value.trim();
  if (!PIN) return;
  document.getElementById('login-erro').textContent = '';
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('painel').classList.add('on');
  carregar();
}
function sair() {
  PIN = '';
  document.getElementById('painel').classList.remove('on');
  document.getElementById('tela-login').style.display = 'block';
  document.getElementById('pin').value = '';
}

document.getElementById('pin').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });

async function carregar() {
  document.getElementById('conteudo').innerHTML = '<div class="loading"><div class="spin"></div>A carregar dados…</div>';
  try {
    const u = new URL(API_URL);
    u.searchParams.set('action', 'dashboard');
    u.searchParams.set('pin', PIN);
    const r = await fetch(u.toString());
    const d = await r.json();
    if (!d.ok) {
      if (d.error === 'pin_invalido') { sair(); document.getElementById('login-erro').textContent = 'PIN incorreto.'; return; }
      throw new Error(d.error || 'erro');
    }
    render(d);
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<div class="vazio">Não foi possível carregar. Verifique a ligação e tente novamente.</div>';
  }
}

function corPct(p) { return p >= 70 ? 'var(--verde)' : p >= 40 ? 'var(--amarelo)' : 'var(--vermelho)'; }
function corNota(v) {
  if (v === null) return 'background:var(--bg3);color:var(--txt3)';
  if (v >= 3.5) return 'background:var(--verde);color:#04140a';
  if (v >= 2.5) return 'background:#8fd14f;color:#0d1117';
  if (v >= 1.5) return 'background:var(--amarelo);color:#0d1117';
  return 'background:var(--vermelho);color:#fff';
}

function render(d) {
  const k = d.kpis;
  let h = '';

  // KPIs
  h += `<div class="kpis">
    <div class="kpi"><div class="kpi-lbl">Elegíveis</div><div class="kpi-num">${k.elegiveis}</div><div class="kpi-sub">colaboradores</div></div>
    <div class="kpi"><div class="kpi-lbl">Autoavaliações</div><div class="kpi-num neon">${k.autoavaliacoes}</div><div class="kpi-sub">${k.pctAdesao}% de adesão</div></div>
    <div class="kpi"><div class="kpi-lbl">Avaliações de gestor</div><div class="kpi-num">${k.avaliacoes}</div><div class="kpi-sub">submetidas</div></div>
    <div class="kpi"><div class="kpi-lbl">Consolidados</div><div class="kpi-num verde">${k.consolidados}</div><div class="kpi-sub">notas finais</div></div>
  </div>`;

  // adesão por unidade + distribuição de faixas
  h += '<div class="grid2">';

  h += '<div class="card"><div class="card-tit">Adesão por unidade</div>';
  if (d.unidades.length) {
    d.unidades.forEach(u => {
      h += `<div class="uni-row">
        <span class="uni-nome">${u.unidade}</span>
        <div class="bar"><div class="bar-fill" style="width:${u.pct}%;background:${corPct(u.pct)}"></div></div>
        <span class="uni-pct" style="color:${corPct(u.pct)}">${u.auto}/${u.eleg}</span>
      </div>`;
    });
  } else h += '<div class="vazio">Sem dados ainda.</div>';
  h += '</div>';

  h += '<div class="card"><div class="card-tit">Distribuição das notas finais</div>';
  const totalF = Object.values(d.faixas).reduce((a, b) => a + b, 0);
  if (totalF) {
    const cores = { 'Excede à expectativa': 'var(--verde)', 'Atende à expectativa': '#8fd14f', 'Abaixo da expectativa': 'var(--amarelo)', 'Insatisfatório': 'var(--vermelho)' };
    Object.keys(d.faixas).forEach(f => {
      const n = d.faixas[f], pct = totalF ? Math.round(n / totalF * 100) : 0;
      h += `<div class="faixa-row">
        <span class="uni-nome">${f}</span>
        <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${cores[f]}"></div></div>
        <span class="uni-pct">${n}</span>
      </div>`;
    });
  } else h += '<div class="vazio">Ainda sem notas consolidadas.<br><span style="font-size:11px">Corra a consolidação no Apps Script.</span></div>';
  h += '</div>';

  h += '</div>'; // fim grid2

  // heatmap
  h += '<div class="card"><div class="card-tit">Mapa de calor · autoavaliação por competência × unidade</div>';
  if (d.heatmap.length) {
    const nC = d.competencias.length;
    h += '<div class="heat-scroll"><div class="heat" style="grid-template-columns:130px repeat(' + nC + ',1fr)">';
    h += '<div></div>';
    d.competencias.forEach(c => h += `<div class="heat-hd">${c}</div>`);
    d.heatmap.forEach(row => {
      h += `<div class="heat-lbl">${row.unidade}</div>`;
      row.medias.forEach(v => {
        h += `<div class="heat-cell" style="${corNota(v)}">${v === null ? '–' : v.toFixed(1)}</div>`;
      });
    });
    h += '</div></div>';
  } else h += '<div class="vazio">Sem autoavaliações ainda.</div>';
  h += '</div>';

  // quem falta
  h += `<div class="card"><div class="card-tit">Ainda não responderam (${d.faltam.length})</div>`;
  if (d.faltam.length) {
    h += '<div class="falta-lista">';
    d.faltam.forEach(p => {
      const tag = p.canal === 'Email' ? '<span class="tag tag-email">email</span>'
        : p.canal === 'WhatsApp' ? '<span class="tag tag-wa">whatsapp</span>'
        : '<span class="tag tag-sem">sem canal</span>';
      h += `<div class="falta-row">
        <div><div class="falta-nome">${p.nome}</div><div class="falta-meta">${p.cargo}</div></div>
        <span class="falta-meta">${p.unidade}</span>
        <span class="falta-meta">${p.metodologia}</span>
        ${tag}
      </div>`;
    });
    h += '</div>';
  } else h += '<div class="vazio">Toda a gente respondeu. 🎉</div>';
  h += '</div>';

  // ===== SECÇÃO CLIMA =====
  if (d.clima) {
    h += `<div class="card" style="border-color:var(--linha2)">
      <div class="card-tit" style="font-size:15px">Pesquisa de Satisfação · ${d.clima.total} ${d.clima.total === 1 ? 'resposta' : 'respostas'}</div>`;
    if (d.clima.total > 0) {
      h += '<div style="font-size:11px;font-family:var(--mono);color:var(--txt2);margin-bottom:14px">Média por dimensão · escala 1 a 4</div>';
      d.clima.dimensoes.forEach(dim => {
        const v = dim.media;
        const pct = v ? (v / 4 * 100) : 0;
        const cor = v === null ? 'var(--txt3)' : v >= 3 ? 'var(--verde)' : v >= 2.5 ? '#8fd14f' : v >= 2 ? 'var(--amarelo)' : 'var(--vermelho)';
        h += `<div class="uni-row">
          <span class="uni-nome">${dim.nome}</span>
          <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${cor}"></div></div>
          <span class="uni-pct" style="color:${cor}">${v === null ? '–' : v.toFixed(2)}</span>
        </div>`;
      });
      if (d.clima.motivosTop && d.clima.motivosTop.length) {
        h += '<div style="margin-top:18px;font-size:11px;font-family:var(--mono);color:var(--txt2);margin-bottom:10px">Motivos mais citados para ser o local ideal</div>';
        h += '<div style="display:flex;flex-wrap:wrap;gap:7px">';
        d.clima.motivosTop.forEach(m => {
          h += `<span class="tag" style="background:var(--bg3);color:var(--txt);border:1px solid var(--linha);padding:5px 10px;font-size:11px">${m.motivo} · ${m.n}</span>`;
        });
        h += '</div>';
      }
    } else {
      h += '<div class="vazio">Ainda sem respostas de clima.</div>';
    }
    h += '</div>';
  }

  document.getElementById('conteudo').innerHTML = h;
}
</script>
</body>
</html>
