<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5b9a">
<title>Pulso JFS · Dashboard RH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef2f7;--surface:#fff;--surface-2:#eef2f7;--surface-3:#e4ebf2;
  --linha:#dde3ea;--linha2:#c7d0db;
  --txt:#13202c;--txt2:#5a6b7b;--txt3:#95a3b2;
  --azul:#0e5b9a;--azul-esc:#0a4576;--azul-cl:#2f86cf;--azul-bg:rgba(14,91,154,.08);
  --verde:#2e9e5b;--verde-bg:rgba(46,158,91,.10);
  --amarelo:#d1960f;--amarelo-bg:rgba(209,150,15,.12);
  --vermelho:#c64141;--vermelho-bg:rgba(198,65,65,.10);
  --sombra:0 1px 2px rgba(19,32,44,.04),0 2px 8px rgba(19,32,44,.04);
  --sombra-2:0 4px 20px rgba(14,91,154,.10);
  --sans:'Inter',system-ui,sans-serif;
}
body{font-family:var(--sans);background:
  radial-gradient(1200px 400px at 100% -5%,rgba(46,158,91,.06),transparent 60%),
  radial-gradient(1200px 500px at -10% 0%,rgba(14,91,154,.07),transparent 55%),
  var(--bg);
  color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 70px}

/* login */
.login{max-width:360px;margin:12vh auto;text-align:center;background:var(--surface);border:1px solid var(--linha);border-radius:18px;padding:36px 30px;box-shadow:var(--sombra-2)}
.login .logo{font-size:30px;font-weight:800;margin-bottom:6px;letter-spacing:-.5px}
.login .logo span{color:var(--azul)}
.login p{color:var(--txt2);font-size:13px;margin-bottom:22px}
.login input{width:100%;padding:14px;background:var(--bg);border:1.5px solid var(--linha);border-radius:12px;color:var(--txt);font-size:15px;text-align:center;letter-spacing:3px;margin-bottom:12px}
.login input:focus{outline:none;border-color:var(--azul);background:#fff}
.login button{width:100%;padding:14px;background:linear-gradient(135deg,var(--azul),var(--azul-cl));color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:var(--sans);box-shadow:0 6px 16px rgba(14,91,154,.25)}
.login .erro{color:var(--vermelho);font-size:12px;margin-top:10px;min-height:16px}

.painel{display:none}
.painel.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 18px;margin-bottom:22px;flex-wrap:wrap;gap:12px;position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--azul),var(--verde) 70%,transparent)}
.top .logo{font-size:24px;font-weight:800;letter-spacing:-.5px}
.top .logo span{color:var(--azul)}
.top .sub{font-size:12px;color:var(--txt2);margin-top:3px}
.top-acoes{display:flex;gap:8px}
.tbtn{padding:9px 15px;background:var(--surface);border:1px solid var(--linha);border-radius:10px;color:var(--txt2);font-size:12px;font-weight:600;cursor:pointer;box-shadow:var(--sombra);transition:.15s}
.tbtn:hover{border-color:var(--azul);color:var(--azul);transform:translateY(-1px)}

/* selector de processo */
.vista-tabs{display:inline-flex;gap:4px;margin-bottom:22px;background:var(--surface);border:1px solid var(--linha);border-radius:14px;padding:5px;box-shadow:var(--sombra)}
.vista-tabs button{padding:10px 20px;border:none;border-radius:10px;background:transparent;color:var(--txt2);font-size:13px;font-weight:700;cursor:pointer;font-family:var(--sans);transition:.18s}
.vista-tabs button:hover{color:var(--azul)}
.vista-tabs button.on{background:linear-gradient(135deg,var(--azul),var(--azul-cl));color:#fff;box-shadow:0 4px 12px rgba(14,91,154,.28)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{position:relative;background:var(--surface);border:1px solid var(--linha);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--sombra);overflow:hidden;transition:.18s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sombra-2)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--azul),var(--azul-cl))}
.kpi.k-verde::before{background:linear-gradient(90deg,var(--verde),#5fc081)}
.kpi.k-amar::before{background:linear-gradient(90deg,var(--amarelo),#e8b84b)}
.kpi-top{display:flex;align-items:center;justify-content:space-between}
.kpi-lbl{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kpi-ic{width:30px;height:30px;border-radius:9px;background:var(--azul-bg);display:flex;align-items:center;justify-content:center;color:var(--azul)}
.kpi-ic svg{width:17px;height:17px}
.kpi-num{font-size:34px;font-weight:800;margin:10px 0 2px;line-height:1}
.kpi-sub{font-size:11px;color:var(--txt3)}

/* cards */
.card{background:var(--surface);border:1px solid var(--linha);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--sombra)}
.card-tit{font-size:14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.card-tit::before{content:'';width:4px;height:16px;background:linear-gradient(var(--azul),var(--azul-cl));border-radius:3px}
.card-tit .dir{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-bottom:16px}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-c{position:relative;flex-shrink:0}
.donut-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut-mid .big{font-size:26px;font-weight:800;line-height:1}
.donut-mid .cap{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.leg{display:flex;flex-direction:column;gap:9px;flex:1;min-width:150px}
.leg-row{display:flex;align-items:center;gap:9px;font-size:12px}
.leg-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.leg-nm{color:var(--txt2)}
.leg-val{margin-left:auto;font-weight:700}

/* segmented */
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:9px;overflow:hidden;background:var(--bg)}
.seg button{padding:6px 12px;background:transparent;border:none;font-size:11px;font-weight:700;color:var(--txt2);cursor:pointer;font-family:var(--sans)}
.seg button.on{background:var(--azul);color:#fff}

/* adesão bars */
.uni-row{display:grid;grid-template-columns:150px 1fr 66px;gap:12px;align-items:center;padding:7px 0;font-size:12px}
.uni-nome{color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.uni-pct{font-weight:700;text-align:right}

/* filtros (matriz + faltam) */
.ctrls{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ctrls input,.ctrls select{padding:10px 13px;border:1.5px solid var(--linha);border-radius:10px;background:var(--bg);color:var(--txt);font-size:13px;font-family:var(--sans)}
.ctrls input{flex:1;min-width:200px}
.ctrls input:focus,.ctrls select:focus{outline:none;border-color:var(--azul);background:#fff}
.ctrls .conta{font-size:12px;color:var(--txt2);margin-left:auto;font-weight:600}

/* chips de canal */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;font-size:12px;font-weight:600;border:1px solid var(--linha);background:var(--surface);cursor:pointer;transition:.15s}
.chip:hover{transform:translateY(-1px)}
.chip b{font-weight:800}
.chip.on{border-color:var(--azul);box-shadow:0 0 0 1.5px var(--azul)}
.chip .cdot{width:9px;height:9px;border-radius:50%}

/* tabelas */
.tbl-scroll{overflow-x:auto}
table.matriz{width:100%;border-collapse:collapse;font-size:12px;min-width:780px}
table.matriz th{text-align:left;padding:10px 9px;border-bottom:2px solid var(--linha);color:var(--txt2);font-weight:700;font-size:11px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
table.matriz td{padding:10px 9px;border-bottom:1px solid var(--linha);white-space:nowrap}
table.matriz th.n,table.matriz td.n{text-align:center}
table.matriz tr.linha{cursor:pointer;transition:.12s}
table.matriz tr.linha:hover{background:var(--azul-bg)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;color:#fff}
.nivel{font-size:10px;color:var(--txt2);background:var(--surface-2);border-radius:6px;padding:3px 8px;font-weight:600}
.detalhe td{background:var(--bg);padding:0}
.detalhe-in{padding:14px}
table.sub{width:100%;border-collapse:collapse;font-size:11px}
table.sub th,table.sub td{padding:7px 8px;border-bottom:1px solid var(--linha);text-align:center}
table.sub th{color:var(--txt2);font-weight:700}
table.sub th:first-child,table.sub td:first-child{text-align:left;color:var(--txt2)}

/* heatmap */
.heat-scroll{overflow-x:auto}
.heat{display:grid;gap:4px;font-size:10px;min-width:680px}
.heat-hd{color:var(--txt2);padding:4px 2px;text-align:center;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);height:96px;font-weight:600}
.heat-lbl{color:var(--txt2);padding:7px 8px;display:flex;align-items:center;font-size:11px}
.heat-cell{padding:9px 2px;text-align:center;border-radius:6px;font-weight:700;font-size:11px}

/* dimensões clima */
.dim-acc{border:1px solid var(--linha);border-radius:12px;margin-bottom:9px;overflow:hidden}
.dim-head{display:grid;grid-template-columns:30px 1fr 150px 56px 24px;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;background:var(--surface)}
.dim-head:hover{background:var(--azul-bg)}
.dim-rank{width:24px;height:24px;border-radius:7px;background:var(--azul-bg);color:var(--azul);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.dim-head .nm{font-weight:600;font-size:13px}
.dim-mini{height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.dim-mini i{display:block;height:100%;border-radius:5px}
.dim-head .md{font-weight:800;text-align:right}
.dim-head .ar{color:var(--txt3);text-align:center}
.dim-body{display:none;padding:4px 14px 12px;background:var(--bg)}
.dim-body.open{display:block}
.perg-row{display:grid;grid-template-columns:1fr 150px 54px;gap:10px;align-items:center;padding:7px 0;font-size:12px;border-top:1px solid var(--linha)}
.perg-row .pm{font-weight:700;text-align:right}

/* listas faltam */
.falta-lista{max-height:420px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.falta-row{display:grid;grid-template-columns:1fr 130px 60px 76px;gap:10px;align-items:center;padding:10px 6px;border-radius:10px;font-size:12px}
.falta-row:nth-child(odd){background:var(--bg)}
.falta-nome{font-weight:600}
.falta-meta{font-size:11px;color:var(--txt2)}
.tag{font-size:9px;padding:3px 8px;border-radius:10px;text-align:center;font-weight:700}
.tag-email{background:var(--verde-bg);color:var(--verde)}
.tag-wa{background:var(--amarelo-bg);color:var(--amarelo)}
.tag-sem{background:var(--vermelho-bg);color:var(--vermelho)}

.coment-lista{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.coment{background:var(--bg);border:1px solid var(--linha);border-left:3px solid var(--azul);border-radius:9px;padding:10px 12px;font-size:12px}

.vazio{text-align:center;padding:30px;color:var(--txt3);font-size:13px}
.loading{text-align:center;padding:70px;color:var(--txt2)}
.spin{width:34px;height:34px;border:3px solid var(--linha);border-top-color:var(--azul);border-radius:50%;margin:0 auto 14px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.motiv-row{display:grid;grid-template-columns:210px 1fr 36px;gap:12px;align-items:center;padding:6px 0;font-size:12px}
.collapse-btn{background:none;border:none;color:var(--azul);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans)}

@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="wrap" id="tela-login">
  <div class="login">
    <div class="logo">Pulso <span>JFS</span></div>
    <p>Dashboard do RH · acesso restrito</p>
    <input type="password" id="pin" placeholder="código" maxlength="16" inputmode="numeric">
    <button onclick="entrar()">Entrar</button>
    <div class="erro" id="login-erro"></div>
  </div>
</div>

<!-- PAINEL -->
<div class="wrap painel" id="painel">
  <div class="top">
    <div>
      <div class="logo">Pulso <span>JFS</span></div>
      <div class="sub" id="top-sub">Dashboard do RH · Ciclo 2026</div>
    </div>
    <div class="top-acoes">
      <button class="tbtn" onclick="carregar()">↻ Actualizar</button>
      <button class="tbtn" onclick="sair()" id="btn-sair">Sair</button>
    </div>
  </div>
  <div id="conteudo"><div class="loading"><div class="spin"></div>A carregar dados…</div></div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzBreSCJ6tSVYfzKzmOUgWm2UpGdBfoUYQEKlg57k4KQTdZbikGeXB29jt8BHFh09YA/exec';
let PIN='', RH='', DADOS=null, vista='desempenho', faixaModo='global';

// login automático pelo link das líderes
(function(){
  const u=new URL(location.href); RH=u.searchParams.get('rh')||'';
  if(RH){ document.getElementById('tela-login').style.display='none';
    document.getElementById('painel').classList.add('on');
    document.getElementById('btn-sair').style.display='none'; carregar(); }
})();

function entrar(){ PIN=document.getElementById('pin').value.trim(); if(!PIN) return;
  document.getElementById('login-erro').textContent='';
  document.getElementById('tela-login').style.display='none';
  document.getElementById('painel').classList.add('on'); carregar(); }
function sair(){ PIN=''; document.getElementById('painel').classList.remove('on');
  document.getElementById('tela-login').style.display='block'; document.getElementById('pin').value=''; }
document.getElementById('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });

function apiUrlValida(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL);}
async function carregar(){
  document.getElementById('conteudo').innerHTML='<div class="loading"><div class="spin"></div>A carregar dados…</div>';
  if(!apiUrlValida()){ document.getElementById('conteudo').innerHTML='<div class="vazio">Configuração em falta: o endereço do servidor (API_URL) não está correto neste ficheiro.</div>'; return; }
  try{
    const u=new URL(API_URL); u.searchParams.set('action','dashboard');
    if(PIN) u.searchParams.set('pin',PIN); if(RH) u.searchParams.set('rh',RH);
    const r=await fetch(u.toString()); const d=await r.json();
    if(!d.ok){
      if(d.error==='pin_invalido'){
        if(RH){ document.getElementById('conteudo').innerHTML='<div class="vazio">Link de acesso inválido. Contacte o administrador do RH.</div>'; return; }
        sair(); document.getElementById('login-erro').textContent='Código incorrecto.'; return;
      }
      throw new Error(d.error||'erro');
    }
    DADOS=d; render(d);
  }catch(e){ document.getElementById('conteudo').innerHTML='<div class="vazio">Não foi possível carregar. Verifique a ligação e tente novamente.</div>'; }
}

/* ---------- helpers ---------- */
function corPct(p){return p>=70?'var(--verde)':p>=40?'var(--amarelo)':'var(--vermelho)';}
function corNotaFundo(v){
  if(v===null||v===undefined)return 'background:var(--surface-2);color:var(--txt3)';
  if(v>=3.5)return 'background:var(--verde);color:#fff';
  if(v>=2.5)return 'background:#79c48f;color:#10351f';
  if(v>=1.5)return 'background:var(--amarelo);color:#fff';
  return 'background:var(--vermelho);color:#fff';
}
function corFaixa(f){return {'Excede à expectativa':'var(--verde)','Atende à expectativa':'#79c48f','Abaixo da expectativa':'var(--amarelo)','Insatisfatório':'var(--vermelho)'}[f]||'var(--txt3)';}
function cel(v){return v===null||v===undefined?'–':Number(v).toFixed(2);}
function esc(s){return (''+s).replace(/</g,'&lt;');}
const IC={
  pessoas:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>'
};
function kpi(cls,ic,lbl,num,sub){
  return `<div class="kpi ${cls||''}"><div class="kpi-top"><div class="kpi-lbl">${lbl}</div><div class="kpi-ic">${IC[ic]||''}</div></div>
    <div class="kpi-num num">${num}</div><div class="kpi-sub">${sub}</div></div>`;
}
function donut(segs,size,stroke){
  size=size||150; stroke=stroke||24;
  const r=(size-stroke)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  const total=segs.reduce((a,s)=>a+s.value,0);
  let off=0, circ='';
  if(total>0){ segs.forEach(s=>{ if(s.value<=0) return; const len=C*s.value/total;
    circ+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${stroke}" stroke-linecap="butt" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`; off+=len; });
  } else circ=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${circ}</svg>`;
}

/* ---------- render ---------- */
function render(d){
  const k=d.kpis;
  let h='';
  h+=`<div class="vista-tabs">
    <button id="vt-desempenho" class="${vista==='desempenho'?'on':''}" onclick="setVista('desempenho')">Avaliação de Desempenho</button>
    <button id="vt-metas" class="${vista==='metas'?'on':''}" onclick="setVista('metas')">Metas</button>
    <button id="vt-clima" class="${vista==='clima'?'on':''}" onclick="setVista('clima')">Pesquisa de Satisfação</button>
  </div>`;

  /* ===== DESEMPENHO ===== */
  h+=`<div id="vista-desempenho" style="display:${vista==='desempenho'?'block':'none'}">`;
  h+=`<div class="kpis">
    ${kpi('','pessoas','Elegíveis',k.elegiveis,'colaboradores')}
    ${kpi('','check','Autoavaliações',k.autoavaliacoes,k.pctAdesao+'% de adesão')}
    ${kpi('k-amar','inbox','Avaliações recebidas',k.avaliacoes,'submetidas')}
    ${kpi('k-verde','trophy','Resultados',k.consolidados,'com nota final')}
  </div>`;

  // linha: donut faixas + anel adesão
  h+='<div class="grid2">';
  h+=`<div class="card"><div class="card-tit">Distribuição das notas finais
      <div class="dir seg">
        <button id="seg-global" class="${faixaModo==='global'?'on':''}" onclick="setFaixa('global')">Global</button>
        <button id="seg-gestor" class="${faixaModo==='gestor'?'on':''}" onclick="setFaixa('gestor')">Gestores</button>
        <button id="seg-nao" class="${faixaModo==='nao'?'on':''}" onclick="setFaixa('nao')">Não-gestores</button>
      </div></div><div id="faixas-box">${faixasHTML(d)}</div></div>`;
  h+=`<div class="card"><div class="card-tit">Adesão global</div>${adesaoHTML(d)}</div>`;
  h+='</div>';

  // matriz
  h+=`<div class="card"><div class="card-tit">Matriz de resultados por colaborador
    <div class="dir"><button class="tbtn" onclick="exportarCSV()">⭳ Exportar CSV</button></div></div>`;
  if(d.matriz && d.matriz.length){
    h+=`<div class="ctrls">
      <input id="m-busca" placeholder="🔍  Pesquisar por nome ou cargo…" oninput="filtrarMatriz()">
      <select id="m-unidade" onchange="filtrarMatriz()"><option value="">Todas as unidades</option></select>
      <span class="conta" id="m-conta"></span></div>`;
    h+='<div class="tbl-scroll"><table class="matriz"><thead><tr>'+
       '<th>Colaborador</th><th>Unidade</th><th class="n">Nível</th>'+
       '<th class="n">Auto</th><th class="n">Gestor</th><th class="n">Pares</th><th class="n">Clientes</th><th class="n">Liderados</th>'+
       '<th class="n">Final</th><th>Classificação</th></tr></thead><tbody id="matriz-body"></tbody></table></div>';
    h+='<div class="falta-meta" style="margin-top:10px">Clique num colaborador para ver o detalhe por competência · ponderação IT_RH_28 (autoavaliação com peso 0).</div>';
  } else h+='<div class="vazio">Ainda sem resultados. Assim que chegarem autoavaliações e avaliações, a matriz aparece aqui.</div>';
  h+='</div>';

  // heatmaps (recolhíveis)
  h+=heatmapHTML('Mapa de calor · autoavaliação de GESTORES','hg',d.heatGestor,d.compsGestor);
  h+=heatmapHTML('Mapa de calor · autoavaliação de NÃO-GESTORES','hn',d.heatNaoGestor,d.compsNaoGestor);

  // quem falta (com filtros)
  h+=`<div class="card"><div class="card-tit">Ainda não fizeram a autoavaliação</div>`;
  if(d.faltam && d.faltam.length){
    h+=`<div class="chips" id="falta-chips"></div>`;
    h+=`<div class="ctrls">
      <input id="f-busca" placeholder="🔍  Pesquisar por nome ou cargo…" oninput="filtrarFaltam()">
      <select id="f-unidade" onchange="filtrarFaltam()"><option value="">Todas as unidades</option></select>
      <select id="f-canal" onchange="filtrarFaltam()">
        <option value="">Todos os canais</option><option value="Email">Email</option><option value="WhatsApp">WhatsApp</option><option value="__sem">Sem canal</option>
      </select>
      <span class="conta" id="f-conta"></span></div>`;
    h+=`<div class="falta-lista" id="falta-body"></div>`;
  } else h+='<div class="vazio">Toda a gente respondeu. 🎉</div>';
  h+='</div>';
  h+=`</div>`; // fim desempenho

  /* ===== CLIMA ===== */
  h+=`<div id="vista-clima" style="display:${vista==='clima'?'block':'none'}">`;
  if(d.clima){
    const dims=d.clima.dimensoes||[];
    const vals=dims.map(x=>x.media).filter(v=>v!==null&&v!==undefined);
    const geral=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):null;
    h+=`<div class="kpis">
      ${kpi('','chat','Respostas',d.clima.total,'pesquisas submetidas')}
      ${kpi('k-verde','star','Média geral',geral===null?'–':geral.toFixed(2),'escala 1 a 4')}
      ${kpi('','layers','Dimensões',dims.length,'avaliadas')}
      ${kpi('k-amar','inbox','Comentários',(d.clima.comentarios||[]).length,'sugestões abertas')}
    </div>`;
    if(d.clima.total>0){
      // donut de sentimento + barras por dimensão lado a lado
      const favor=[], contra=[]; // favoráveis (>=3) vs desfavoráveis (<3) por média de dimensão
      let nFav=0,nDes=0; dims.forEach(x=>{ if(x.media===null)return; if(x.media>=3)nFav++; else nDes++; });
      h+='<div class="grid2">';
      h+=`<div class="card"><div class="card-tit">Clima por dimensão</div>
        <div class="donut-wrap">
          <div class="donut-c" style="width:150px;height:150px">${donut([{value:nFav,color:'var(--verde)'},{value:nDes,color:'var(--amarelo)'}])}
            <div class="donut-mid"><div class="big num" style="color:var(--verde)">${nFav}/${nFav+nDes}</div><div class="cap">dimensões<br>favoráveis</div></div>
          </div>
          <div class="leg">
            <div class="leg-row"><span class="leg-dot" style="background:var(--verde)"></span><span class="leg-nm">Favorável (média ≥ 3,0)</span><span class="leg-val">${nFav}</span></div>
            <div class="leg-row"><span class="leg-dot" style="background:var(--amarelo)"></span><span class="leg-nm">A melhorar (média &lt; 3,0)</span><span class="leg-val">${nDes}</span></div>
          </div>
        </div></div>`;
      h+=`<div class="card"><div class="card-tit">Média geral</div>${medidorClima(geral)}</div>`;
      h+='</div>';

      // dimensões (accordion com mini-barra + ranking)
      h+=`<div class="card"><div class="card-tit">Resultados por dimensão <span class="dir falta-meta">clique para ver as perguntas</span></div>`;
      const ord=dims.map((x,i)=>({x,i})).sort((a,b)=>(b.x.media||0)-(a.x.media||0));
      ord.forEach((o,rank)=>{
        const dim=o.x, di=o.i, v=dim.media, pct=v?(v/4*100):0;
        const cor=v===null?'var(--txt3)':v>=3?'var(--verde)':v>=2.5?'#79c48f':v>=2?'var(--amarelo)':'var(--vermelho)';
        const num=['I','II','III','IV','V','VI'][di];
        const perg=(d.clima.perguntas||[]).filter(p=>p.dim===num);
        h+=`<div class="dim-acc"><div class="dim-head" onclick="toggleDim(${di})">
          <div class="dim-rank">${rank+1}</div><div class="nm">${dim.nome}</div>
          <div class="dim-mini"><i style="width:${pct}%;background:${cor}"></i></div>
          <div class="md num" style="color:${cor}">${v===null?'–':v.toFixed(2)}</div>
          <div class="ar" id="ar-${di}">▸</div></div>
          <div class="dim-body" id="dimb-${di}">`;
        perg.forEach(p=>{ const pc=p.media===null?'var(--txt3)':p.media>=3?'var(--verde)':p.media>=2.5?'#5a9e74':p.media>=2?'var(--amarelo)':'var(--vermelho)';
          const pp=p.media?(p.media/4*100):0;
          h+=`<div class="perg-row"><div>${esc(p.texto)}</div><div class="dim-mini"><i style="width:${pp}%;background:${pc}"></i></div><div class="pm num" style="color:${pc}">${p.media===null?'–':p.media.toFixed(2)}</div></div>`;
        });
        h+='</div></div>';
      });
      h+='</div>';

      // motivos
      if(d.clima.motivosTop && d.clima.motivosTop.length){
        const max=Math.max.apply(null,d.clima.motivosTop.map(m=>m.n));
        h+='<div class="card"><div class="card-tit">Fatores de motivação mais citados</div>';
        d.clima.motivosTop.forEach(m=>{ const pct=max?Math.round(m.n/max*100):0;
          h+=`<div class="motiv-row"><span class="falta-meta" style="color:var(--txt)">${esc(m.motivo)}</span>
            <div class="bar"><div class="bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--azul),var(--azul-cl))"></div></div>
            <span class="uni-pct num">${m.n}</span></div>`; });
        h+='</div>';
      }
      // comentários
      if(d.clima.comentarios && d.clima.comentarios.length){
        h+=`<div class="card"><div class="card-tit">Sugestões e comentários (${d.clima.comentarios.length})</div><div class="coment-lista">`;
        d.clima.comentarios.forEach(c=>{ h+=`<div class="coment">${esc(c)}</div>`; });
        h+='</div></div>';
      }
    } else h+='<div class="card"><div class="vazio">Ainda sem respostas de clima.</div></div>';
  }
  h+=`</div>`; // fim clima

  /* ===== METAS ===== */
  h+=`<div id="vista-metas" style="display:${vista==='metas'?'block':'none'}">`;
  if(d.metas){
    const m=d.metas;
    h+=`<div class="kpis">
      ${kpi('','trophy','Fase',faseLabel(m.fase),'ciclo '+m.ciclo)}
      ${kpi('','layers','Metas definidas',m.definidos+'/'+m.elegiveis,'colaboradores')}
      ${kpi('k-amar','check','Aceites',m.aceites,'pelos colaboradores')}
      ${kpi('k-verde','star','Avaliados',m.avaliados,'com resultado')}
    </div>`;
    const nomes=['Supera as expectativas','Atende as expectativas','Parcialmente atinge as expectativas','Insatisfatório','Deficiente / Não atingiu'];
    const total=nomes.reduce((a,n)=>a+(m.faixas[n]||0),0);
    h+='<div class="grid2"><div class="card"><div class="card-tit">Distribuição do atingimento</div>';
    if(total){
      const segs=nomes.map(n=>({value:m.faixas[n]||0,color:corClasMeta(n)}));
      let leg=''; nomes.forEach(n=>{const v=m.faixas[n]||0,pc=Math.round(v/total*100); if(v||true) leg+=`<div class="leg-row"><span class="leg-dot" style="background:${corClasMeta(n)}"></span><span class="leg-nm">${n}</span><span class="leg-val">${v} · ${pc}%</span></div>`;});
      h+=`<div class="donut-wrap"><div class="donut-c" style="width:150px;height:150px">${donut(segs)}<div class="donut-mid"><div class="big num">${total}</div><div class="cap">avaliados</div></div></div><div class="leg">${leg}</div></div>`;
    } else h+='<div class="vazio">Ainda sem avaliações de metas.</div>';
    h+='</div>';
    const pbar=(lbl,val,tot)=>{const p=tot?Math.round(val/tot*100):0;return `<div class="uni-row"><span class="uni-nome">${lbl}</span><div class="bar"><div class="bar-fill" style="width:${p}%;background:linear-gradient(90deg,var(--azul),var(--azul-cl))"></div></div><span class="uni-pct num">${val}/${tot}</span></div>`;};
    h+=`<div class="card"><div class="card-tit">Progresso do ciclo</div>${pbar('Metas definidas',m.definidos,m.elegiveis)}${pbar('Aceites pelo colaborador',m.aceites,m.elegiveis)}${pbar('Avaliados',m.avaliados,m.elegiveis)}</div>`;
    h+='</div>';
    h+='<div class="card"><div class="card-tit">Metas por colaborador</div>';
    if(m.lista && m.lista.length){
      h+=`<div class="ctrls"><input id="mt-busca" placeholder="🔍  Pesquisar por nome ou cargo…" oninput="filtrarMetas()"><select id="mt-unidade" onchange="filtrarMetas()"><option value="">Todas as unidades</option></select><span class="conta" id="mt-conta"></span></div>`;
      h+='<div class="tbl-scroll"><table class="matriz"><thead><tr><th>Colaborador</th><th>Unidade</th><th>Gestor</th><th class="n">Metas</th><th class="n">Aceite</th><th class="n">Compet.</th><th class="n">Atingimento</th><th>Classificação</th></tr></thead><tbody id="metas-body"></tbody></table></div>';
    } else h+='<div class="vazio">Sem colaboradores elegíveis a metas (lideranças e níveis V+).</div>';
    h+='</div>';
  } else h+='<div class="card"><div class="vazio">Módulo de metas ainda não configurado.</div></div>';
  h+=`</div>`; // fim metas

  document.getElementById('conteudo').innerHTML=h;
  preencherFiltros();
  filtrarMatriz();
  filtrarFaltam();
  filtrarMetas();
}
function faseLabel(f){return {definicao:'Definição',acompanhamento:'Acompanh.',avaliacao:'Avaliação'}[f]||f;}
function corClasMeta(c){return {'Supera as expectativas':'var(--verde)','Atende as expectativas':'#5fc081','Parcialmente atinge as expectativas':'#79c48f','Insatisfatório':'var(--amarelo)','Deficiente / Não atingiu':'var(--vermelho)'}[c]||'var(--txt3)';}
function filtrarMetas(){
  const body=document.getElementById('metas-body'); if(!body||!DADOS||!DADOS.metas||!DADOS.metas.lista) return;
  const be=document.getElementById('mt-busca'), se=document.getElementById('mt-unidade');
  const q=(be?be.value:'').toLowerCase().trim(), uni=se?se.value:'';
  let n=0,out='';
  DADOS.metas.lista.forEach(p=>{
    if(q && (p.nome||'').toLowerCase().indexOf(q)<0 && (p.cargo||'').toLowerCase().indexOf(q)<0) return;
    if(uni && p.unidade!==uni) return; n++;
    const pct=p.pct!=null?Math.round(p.pct*100)+'%':'–';
    const aceite=p.aceite?'<span style="color:var(--verde);font-weight:700">sim</span>':'<span style="color:var(--amarelo);font-weight:700">não</span>';
    const cls=(p.classificacao&&p.classificacao!=='—')?`<span class="pill" style="background:${corClasMeta(p.classificacao)}">${p.classificacao}</span>`:'<span class="falta-meta">—</span>';
    out+=`<tr><td><b>${p.nome}</b><div class="falta-meta">${p.cargo||''}</div></td><td class="falta-meta">${p.unidade||''}</td><td class="falta-meta">${p.gestor||''}</td><td class="n num">${p.nMetas}</td><td class="n">${aceite}</td><td class="n num">${p.notaComp!=null?p.notaComp.toFixed(2):'–'}</td><td class="n num" style="font-weight:800">${pct}</td><td>${cls}</td></tr>`;
  });
  body.innerHTML=out||'<tr><td colspan="8"><div class="vazio">Ninguém corresponde à pesquisa.</div></td></tr>';
  const c=document.getElementById('mt-conta'); if(c) c.textContent=n+' de '+DADOS.metas.lista.length;
}

/* ---------- vistas ---------- */
function setVista(v){ vista=v;
  ['desempenho','metas','clima'].forEach(x=>{
    const el=document.getElementById('vista-'+x); if(el) el.style.display=(x===v?'block':'none');
    const bt=document.getElementById('vt-'+x); if(bt) bt.className=(x===v?'on':'');
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- faixas (donut) ---------- */
function faixasHTML(d){
  const mapa={global:d.faixas,gestor:d.faixasGestor,nao:d.faixasNaoGestor};
  const f=mapa[faixaModo]||d.faixas;
  const nomes=['Excede à expectativa','Atende à expectativa','Abaixo da expectativa','Insatisfatório'];
  const total=nomes.reduce((a,n)=>a+(f[n]||0),0);
  if(!total) return '<div class="vazio">Ainda sem notas finais neste grupo.</div>';
  const segs=nomes.map(n=>({value:f[n]||0,color:corFaixa(n)}));
  let leg='';
  nomes.forEach(n=>{ const v=f[n]||0, pct=Math.round(v/total*100);
    leg+=`<div class="leg-row"><span class="leg-dot" style="background:${corFaixa(n)}"></span><span class="leg-nm">${n}</span><span class="leg-val">${v} · ${pct}%</span></div>`; });
  return `<div class="donut-wrap">
    <div class="donut-c" style="width:150px;height:150px">${donut(segs)}
      <div class="donut-mid"><div class="big num">${total}</div><div class="cap">com nota</div></div>
    </div><div class="leg">${leg}</div></div>`;
}
function setFaixa(m){ faixaModo=m; document.getElementById('faixas-box').innerHTML=faixasHTML(DADOS);
  ['global','gestor','nao'].forEach(x=>{const b=document.getElementById('seg-'+x); if(b) b.className=(x===m?'on':'');}); }

/* ---------- adesão (anel + top/fundo) ---------- */
function adesaoHTML(d){
  const pct=d.kpis.pctAdesao||0;
  const col=corPct(pct);
  let barras='';
  const us=(d.unidades||[]).slice().sort((a,b)=>b.pct-a.pct);
  us.slice(0,6).forEach(u=>{ barras+=`<div class="uni-row"><span class="uni-nome" title="${u.unidade}">${u.unidade}</span>
    <div class="bar"><div class="bar-fill" style="width:${u.pct}%;background:${corPct(u.pct)}"></div></div>
    <span class="uni-pct num" style="color:${corPct(u.pct)}">${u.auto}/${u.eleg}</span></div>`; });
  return `<div class="donut-wrap" style="margin-bottom:14px">
    <div class="donut-c" style="width:140px;height:140px">${donut([{value:pct,color:col},{value:100-pct,color:'var(--surface-2)'}])}
      <div class="donut-mid"><div class="big num" style="color:${col}">${pct}%</div><div class="cap">responderam</div></div>
    </div>
    <div class="leg"><div class="leg-row"><span class="leg-nm">Concluíram</span><span class="leg-val">${d.kpis.autoavaliacoes}</span></div>
      <div class="leg-row"><span class="leg-nm">Em falta</span><span class="leg-val">${d.kpis.elegiveis-d.kpis.autoavaliacoes}</span></div>
      <div class="leg-row"><span class="leg-nm">Elegíveis</span><span class="leg-val">${d.kpis.elegiveis}</span></div></div>
  </div>
  <div style="font-size:11px;color:var(--txt2);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:4px 0 6px">Melhores unidades</div>
  ${barras||'<div class="vazio">Sem dados.</div>'}`;
}

/* ---------- medidor clima ---------- */
function medidorClima(g){
  if(g===null) return '<div class="vazio">Sem dados.</div>';
  const pct=Math.round((g-1)/3*100); // 1..4 -> 0..100
  const col=g>=3?'var(--verde)':g>=2.5?'#79c48f':g>=2?'var(--amarelo)':'var(--vermelho)';
  const txt=g>=3?'Clima favorável':g>=2.5?'Clima moderado':g>=2?'Clima a melhorar':'Clima crítico';
  return `<div style="text-align:center;padding:6px 0 2px">
    <div class="num" style="font-size:46px;font-weight:800;color:${col};line-height:1">${g.toFixed(2)}<span style="font-size:20px;color:var(--txt3);font-weight:600"> / 4</span></div>
    <div style="font-weight:700;color:${col};margin:8px 0 14px">${txt}</div>
    <div class="bar" style="height:14px"><div class="bar-fill" style="width:${pct}%;background:${col}"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-top:6px"><span>1 Discordo totalmente</span><span>4 Concordo totalmente</span></div>
  </div>`;
}

/* ---------- heatmap recolhível ---------- */
let heatAberto={hg:true,hn:true};
function heatmapHTML(titulo,id,heat,comps){
  const aberto=heatAberto[id]!==false;
  let h=`<div class="card"><div class="card-tit">${titulo}<div class="dir"><button class="collapse-btn" id="heatbtn-${id}" onclick="toggleHeat('${id}')">${aberto?'ocultar':'mostrar'}</button></div></div>`;
  h+=`<div id="heat-${id}" style="display:${aberto?'block':'none'}">`;
  if(heat && heat.length){
    const nC=comps.length;
    h+='<div class="heat-scroll"><div class="heat" style="grid-template-columns:150px repeat('+nC+',1fr)"><div></div>';
    comps.forEach(c=>h+=`<div class="heat-hd">${c}</div>`);
    heat.forEach(row=>{ h+=`<div class="heat-lbl">${row.unidade}</div>`;
      row.medias.forEach(v=>{ h+=`<div class="heat-cell num" style="${corNotaFundo(v)}">${v===null?'–':v.toFixed(1)}</div>`; }); });
    h+='</div></div>';
  } else h+='<div class="vazio">Sem autoavaliações neste grupo ainda.</div>';
  h+='</div></div>'; return h;
}
function toggleHeat(id){
  const el=document.getElementById('heat-'+id); if(!el) return;
  const ab = el.style.display==='none';
  el.style.display = ab?'block':'none'; heatAberto[id]=ab;
  const btn=document.getElementById('heatbtn-'+id); if(btn) btn.textContent=ab?'ocultar':'mostrar';
}

function toggleDim(i){ const b=document.getElementById('dimb-'+i),a=document.getElementById('ar-'+i);
  const open=b.classList.toggle('open'); a.textContent=open?'▾':'▸'; }

/* ---------- filtros matriz ---------- */
function preencherFiltros(){
  if(!DADOS) return;
  const uMat=document.getElementById('m-unidade'), uFal=document.getElementById('f-unidade');
  if(uMat && DADOS.matriz){ const s={}; DADOS.matriz.forEach(p=>{if(p.unidade)s[p.unidade]=1;});
    uMat.innerHTML='<option value="">Todas as unidades</option>'+Object.keys(s).sort().map(u=>`<option>${u}</option>`).join(''); }
  if(uFal && DADOS.faltam){ const s={}; DADOS.faltam.forEach(p=>{if(p.unidade)s[p.unidade]=1;});
    uFal.innerHTML='<option value="">Todas as unidades</option>'+Object.keys(s).sort().map(u=>`<option>${u}</option>`).join(''); }
  const uMet=document.getElementById('mt-unidade');
  if(uMet && DADOS.metas && DADOS.metas.lista){ const s={}; DADOS.metas.lista.forEach(p=>{if(p.unidade)s[p.unidade]=1;});
    uMet.innerHTML='<option value="">Todas as unidades</option>'+Object.keys(s).sort().map(u=>`<option>${u}</option>`).join(''); }
}
function filtrarMatriz(){
  const body=document.getElementById('matriz-body'); if(!body||!DADOS||!DADOS.matriz) return;
  const be=document.getElementById('m-busca'), se=document.getElementById('m-unidade');
  const q=(be?be.value:'').toLowerCase().trim(), uni=se?se.value:'';
  let n=0,out='';
  DADOS.matriz.forEach((p,i)=>{
    if(q && (p.nome||'').toLowerCase().indexOf(q)<0 && (p.cargo||'').toLowerCase().indexOf(q)<0) return;
    if(uni && p.unidade!==uni) return; n++;
    const niv=p.grupo==='gestor'?(p.metodologia||'').toString():'90º';
    out+=`<tr class="linha" onclick="toggleDet(${i})">
      <td><b>${p.nome||'—'}</b><div class="falta-meta">${p.cargo||''}</div></td>
      <td class="falta-meta">${p.unidade||''}</td><td class="n"><span class="nivel">${niv}</span></td>
      <td class="n num">${cel(p.auto)}</td><td class="n num">${cel(p.gestor)}</td><td class="n num">${cel(p.pares)}</td>
      <td class="n num">${cel(p.clientes)}</td><td class="n num">${cel(p.liderados)}</td>
      <td class="n num" style="font-weight:800">${cel(p.final)}</td>
      <td><span class="pill" style="background:${corFaixa(p.faixa)}">${p.faixa}</span></td></tr>
      <tr class="detalhe" id="det-${i}" style="display:none"><td colspan="10"><div class="detalhe-in" id="detin-${i}"></div></td></tr>`;
  });
  body.innerHTML=out||'<tr><td colspan="10"><div class="vazio">Nenhum colaborador corresponde à pesquisa.</div></td></tr>';
  const c=document.getElementById('m-conta'); if(c) c.textContent=n+' de '+DADOS.matriz.length+' colaboradores';
}
function toggleDet(i){
  const tr=document.getElementById('det-'+i); if(!tr) return;
  if(tr.style.display==='none'){ const p=DADOS.matriz[i];
    let s='<table class="sub"><thead><tr><th>Competência</th><th>Auto</th><th>Gestor</th><th>Pares</th><th>Clientes</th><th>Liderados</th><th>Ponderado</th></tr></thead><tbody>';
    p.comps.forEach(c=>{ s+=`<tr><td>${c.nome}</td><td class="num">${cel(c.auto)}</td><td class="num">${cel(c.gestor)}</td><td class="num">${cel(c.pares)}</td><td class="num">${cel(c.clientes)}</td><td class="num">${cel(c.liderados)}</td><td class="num" style="font-weight:800">${cel(c.ponderado)}</td></tr>`; });
    s+='</tbody></table>'; document.getElementById('detin-'+i).innerHTML=s; tr.style.display='table-row';
  } else tr.style.display='none';
}

/* ---------- filtros faltam ---------- */
function filtrarFaltam(){
  const body=document.getElementById('falta-body'); if(!body||!DADOS||!DADOS.faltam) return;
  // chips de canal (contagem total)
  const tot={Email:0,WhatsApp:0,__sem:0};
  DADOS.faltam.forEach(p=>{ if(p.canal==='Email')tot.Email++; else if(p.canal==='WhatsApp')tot.WhatsApp++; else tot.__sem++; });
  const chips=document.getElementById('falta-chips');
  if(chips){ const cur=document.getElementById('f-canal')?document.getElementById('f-canal').value:'';
    chips.innerHTML=
      `<div class="chip ${cur===''?'on':''}" onclick="setCanal('')"><span class="cdot" style="background:var(--txt3)"></span>Todos <b>${DADOS.faltam.length}</b></div>`+
      `<div class="chip ${cur==='Email'?'on':''}" onclick="setCanal('Email')"><span class="cdot" style="background:var(--verde)"></span>Email <b>${tot.Email}</b></div>`+
      `<div class="chip ${cur==='WhatsApp'?'on':''}" onclick="setCanal('WhatsApp')"><span class="cdot" style="background:var(--amarelo)"></span>WhatsApp <b>${tot.WhatsApp}</b></div>`+
      `<div class="chip ${cur==='__sem'?'on':''}" onclick="setCanal('__sem')"><span class="cdot" style="background:var(--vermelho)"></span>Sem canal <b>${tot.__sem}</b></div>`;
  }
  const be=document.getElementById('f-busca'), se=document.getElementById('f-unidade'), ce=document.getElementById('f-canal');
  const q=(be?be.value:'').toLowerCase().trim(), uni=se?se.value:'', canal=ce?ce.value:'';
  let n=0,out='';
  DADOS.faltam.forEach(p=>{
    if(q && (p.nome||'').toLowerCase().indexOf(q)<0 && (p.cargo||'').toLowerCase().indexOf(q)<0) return;
    if(uni && p.unidade!==uni) return;
    if(canal==='__sem'){ if(p.canal==='Email'||p.canal==='WhatsApp') return; }
    else if(canal && p.canal!==canal) return;
    n++;
    const tag=p.canal==='Email'?'<span class="tag tag-email">email</span>':p.canal==='WhatsApp'?'<span class="tag tag-wa">whatsapp</span>':'<span class="tag tag-sem">sem canal</span>';
    out+=`<div class="falta-row"><div><div class="falta-nome">${p.nome}</div><div class="falta-meta">${p.cargo||''}</div></div>
      <span class="falta-meta">${p.unidade||''}</span><span class="falta-meta">${p.metodologia||''}</span>${tag}</div>`;
  });
  body.innerHTML=out||'<div class="vazio">Ninguém corresponde a este filtro.</div>';
  const c=document.getElementById('f-conta'); if(c) c.textContent=n+' de '+DADOS.faltam.length+' por responder';
}
function setCanal(v){ const ce=document.getElementById('f-canal'); if(ce) ce.value=v; filtrarFaltam(); }

/* ---------- CSV ---------- */
function exportarCSV(){
  if(!DADOS||!DADOS.matriz) return;
  const cab=['Colaborador','Cargo','Unidade','Nivel','Auto','Gestor','Pares','Clientes','Liderados','Nota final','Classificacao','Nº avaliadores'];
  const linhas=DADOS.matriz.map(p=>[p.nome,p.cargo,p.unidade,(p.grupo==='gestor'?p.metodologia:'90º'),p.auto,p.gestor,p.pares,p.clientes,p.liderados,p.final,p.faixa,p.nAval]);
  let csv='﻿'+cab.join(';')+'\n'+linhas.map(l=>l.map(c=>c===null||c===undefined?'':('"'+String(c).replace(/"/g,'""')+'"')).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Pulso_JFS_Matriz_Resultados.csv'; a.click();
}
